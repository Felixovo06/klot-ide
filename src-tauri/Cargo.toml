[package]
name = "klot-ide"
version = "0.1.0"
description = "Klot IDE (KE) 原生桌面后端"
authors = ["Klot Team"]
edition = "2021"

[lib]
name = "klot_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
notify = "6"
notify-debouncer-mini = "0.4"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
nix = { version = "0.29", features = ["signal", "process"] }
